---
# Roster and placement checks. Included by preflight on every run and by
# inventory-check.yml in CI, so a pull request that breaks the roster cannot
# merge — and cannot reach a box.

- name: Roster is a mapping
  ansible.builtin.assert:
    that:
      - dev_people is mapping
    fail_msg: "dev_people must be a mapping of account name -> {ssh_keys: [...]}."
    quiet: true

- name: Every roster entry has a valid name and at least one well-formed key
  ansible.builtin.assert:
    that:
      - item.key is match('^[a-z_][a-z0-9_-]{0,31}$')
      - item.key != 'e2e'
      - item.value.ssh_keys is defined
      - item.value.ssh_keys is sequence
      - item.value.ssh_keys is not string
      - item.value.ssh_keys | reject('match', '^(ssh-(ed25519|rsa)|ecdsa-sha2-nistp(256|384|521)|sk-(ssh-ed25519|ecdsa-sha2-nistp256)@openssh\.com) [A-Za-z0-9+/]+=*( .*)?$') | list | length == 0
    fail_msg: >-
      Roster entry '{{ item.key }}' is invalid. Names are lowercase Unix
      account names (not 'e2e', which is the loop service account); ssh_keys is
      a list of OpenSSH public keys, one per device.

      An EMPTY list is legal and means suspended: the account and its home
      survive untouched, authorized_keys is emptied, and since password
      authentication does not exist on these boxes the person cannot log in
      until a key is put back. That is the state to leave someone in while a
      replacement key is on its way — it is not the same as removal, which
      deletes the home directory.
    quiet: true
  loop: "{{ dev_people | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Placement lists are lists of names
  ansible.builtin.assert:
    that:
      - dev_users is sequence and dev_users is not string
      - dev_users_absent is sequence and dev_users_absent is not string
    fail_msg: >-
      dev_users and dev_users_absent must be lists of names for
      {{ inventory_hostname }}. Keys belong in the roster (dev_people), not
      here.
    quiet: true

- name: Every placed name is in the roster
  ansible.builtin.assert:
    that:
      - item in dev_people
    fail_msg: >-
      '{{ item }}' is listed for {{ inventory_hostname }} but is not in
      dev_people. Add the person to the roster (group_vars/all.yml) first;
      placement lists carry names only.
    quiet: true
  loop: "{{ dev_users + dev_users_absent }}"

- name: No name is both present and absent
  ansible.builtin.assert:
    that:
      - dev_users | intersect(dev_users_absent) | length == 0
    fail_msg: >-
      {{ dev_users | intersect(dev_users_absent) }} appear in both dev_users
      and dev_users_absent for {{ inventory_hostname }}. Decide.
    quiet: true

- name: No duplicate names in a placement list
  ansible.builtin.assert:
    that:
      - dev_users | unique | length == dev_users | length
      - dev_users_absent | unique | length == dev_users_absent | length
    fail_msg: "Duplicate names in dev_users or dev_users_absent for {{ inventory_hostname }}."
    quiet: true
