[defaults]
# No inventory here: this repository is the platform, and inventories live in
# deployment repositories, one per organisation. Run the playbook from a
# deployment checkout, which supplies -i and its own ansible.cfg.
roles_path = roles
host_key_checking = False
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
# Undefined variables stop the play by default in ansible-core. This repo
# forbids fallback values, so that default is relied upon rather than relaxed:
# a template that silently renders an empty string is exactly that failure.
deprecation_warnings = False

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
