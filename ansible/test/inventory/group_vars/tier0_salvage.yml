---
# Tier values for the droplet, as the harness's *inventory* sees them.
#
# Read this before changing anything here, because which file wins depends on
# which playbook is running:
#
#   site.yml     lives beside ansible/group_vars/, so the PLATFORM's
#                tier0_salvage.yml outranks this file and every key below is
#                shadowed by it. Nothing here reaches the provisioning run.
#   verify.yml   lives in ansible/test/, which has no adjacent group_vars, so
#                this file is the only group_vars it sees. Deleting a key here
#                fails verify.yml with 'is undefined'.
#
# So this file exists for verify.yml. The values that must actually take effect
# during provisioning — the lowered memory floor and ceilings, and WireGuard off
# — are in test/host.yml, which run.sh passes with -e to both playbooks and
# which outranks every group_vars file in both directions. Keep the two in step.
#
# This is a MECHANISM test, not a capacity test. A 2 GB droplet cannot host a
# seat and is not a tier-0 box in any meaningful sense. Never copy these values
# to a real box.

dev_tier: "tier0-salvage (test harness)"
dev_tier_min_ram_mb: 900

dev_user_memory_high: "1G"
dev_user_memory_max: "1400M"
dev_user_cpu_weight: 100
dev_user_io_weight: 100
dev_user_tasks_max: 2048

dev_quota_enabled: true
dev_user_quota_soft: "2G"
dev_user_quota_hard: "3G"

dev_registry_mirror_enabled: true

# No hub peer for a throwaway droplet.
dev_wireguard_enabled: false

dev_e2e_enabled: true
