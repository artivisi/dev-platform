---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# logind restart does not end sessions on current systemd; it re-reads the lid
# handling.
- name: Restart logind
  ansible.builtin.systemd_service:
    name: systemd-logind
    state: restarted

# Restarting journald does not lose entries: writers hold the socket, and the
# new process picks up the same journal files.
- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
