; This organisation's fleet. Source of truth for both invocation modes:
;
;   push  — ansible-playbook -e @<secrets>/<box>.yml site.yml
;   pull  — every box runs ansible-pull against THIS repository on a timer and
;           limits itself to its own hostname (inventory name == hostname,
;           asserted by preflight)
;
; ansible_host is the box's address on your WireGuard hub network. This file is
; also the address book developers read (Developer Guide), so keep it the VPN
; address, not a LAN one.
;
; Group membership selects the capacity tier. The tiers themselves are defined
; by the platform, in platform/ansible/group_vars/tier*.yml — do not copy them
; here. A host in no tier group, or in two, fails preflight.
;
; Per-box secrets are NOT in this repository. They live on the box in
; /etc/dev-platform/host.yml — see platform/ansible/host.yml.example.

[dev_boxes:children]
tier0_salvage
tier1_compact
tier2_upgraded
tier3_mid
tier4_primary

[tier0_salvage]
; Salvaged laptop or ex-office desktop, 8 GB, as found.
; box-02 ansible_host=10.9.0.11 ansible_user=root

[tier1_compact]
; 16 GB desktop, multiuser, ceilings sized for light work.
; box-01 ansible_host=10.9.0.10 ansible_user=root

[tier2_upgraded]
; Salvaged desktop upgraded to 32 GB.

[tier3_mid]
; Ryzen 7 / 64 GB new build.

[tier4_primary]
; Ryzen 9 / 128 GB primary workstation.
