---
# Test-harness variables. Mirrors a deployment's inventory/group_vars/all.yml, with placement
# inlined (there is one host and it is generated).

dev_timezone: "Asia/Jakarta"

# The droplet already points at DigitalOcean's own mirror, so this asserts the
# archive is what it should be rather than rewriting it. The rewrite path — an
# installer-written archive.ubuntu.com URI replaced by a configured mirror —
# is not reachable here, because no DigitalOcean image ships one.
dev_apt_mirror: "http://mirrors.digitalocean.com/ubuntu/"

dev_port_block_base: 20000
dev_port_block_size: 100

dev_registry_data_dir: "/srv/registry"
dev_e2e_home: "/srv/e2e"

# pnpm is installed as a pinned standalone binary, not via get.pnpm.io/install.sh
# — that script misresolves $HOME under become_user and rewrites shell rc files.
dev_pnpm_version: "11.21.0"

# The roster (dev_people) is generated by provision.sh into roster.yml next to
# this file, from DEV_TEST_PUBKEY: every test person shares the operator's key
# so the harness can log in as each of them. It is generated rather than
# templated because the same inventory is evaluated on the droplet by
# ansible-pull, where neither the env var nor the key file exists.

# Initial placement. run.sh later moves alice to absent and adds carol via
# --extra-vars to exercise the add/remove path.
dev_users: [alice, bob]
dev_users_absent: []

# Self-provisioning against a copy of the working tree pushed to the droplet by
# run.sh — the pull mechanism is exercised without a deploy key or a commit.
dev_pull_enabled: true
dev_repo_url: "/srv/dev-platform-src"
dev_repo_branch: "main"
dev_repo_deploy_key: "/etc/dev-platform/deploy_key"
dev_pull_inventory: "ansible/test/inventory/test.ini"
# Relative to the checkout. The harness clones the platform repository itself
# rather than a deployment, so the playbook is under ansible/ instead of being
# the one-line site.yml at a deployment's root.
dev_pull_playbook: "ansible/site.yml"
dev_pull_host_vars_file: "/etc/dev-platform/host.yml"
dev_pull_checkout_dir: "/var/lib/dev-platform/repo"
# Daily, so the timer cannot fire mid-test and re-apply the initial placement
# between the churn step and its verification. run.sh starts the service
# explicitly.
dev_pull_on_calendar: "*-*-* 03:00:00"
